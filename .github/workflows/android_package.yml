name: Android 打包

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug / release）'
        type: choice
        default: release
        options:
          - release
          - debug
      enable_render_probe:
        description: '开启渲染诊断探针（黑屏/渲染排查，含每帧像素采样，见 docs/dev/rendering-diagnosis.md）'
        type: boolean
        default: false
      log_level:
        description: '引擎日志级别（auto=按构建类型：release→info，debug→debug）'
        type: choice
        default: auto
        options:
          - auto
          - trace
          - debug
          - info
          - warn
          - err
          - critical
          - off
      release_version:
        description: '发布版本号（X.Y.Z，如 0.1.4）。会在勾选「发布 Release」时按 android-vX.Y.Z 打 tag + 建 GitHub Release，并写入原生 app 版本与软件内版本。'
        type: string
        default: ''
      publish_release:
        description: '发布 Release 到 GitHub Releases（需填「发布版本号」）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - 'android-v*'

# 只保留最新一次运行的产物（避免并发互相覆盖缓存）
concurrency:
  group: android-package
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (${{ inputs.build_type != '' && inputs.build_type || 'release' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    # 需要写 contents 才能在勾选「发布 Release」时打 git tag + 建 GitHub Release
    permissions:
      contents: write
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'release' }}
      # 渲染诊断探针开关 + 日志级别，透传给 build_android.sh 的 cmake configure
      ENABLE_RENDER_PROBE: ${{ inputs.enable_render_probe != '' && inputs.enable_render_probe || 'false' }}
      KRKR_LOG_LEVEL: ${{ inputs.log_level != '' && inputs.log_level || 'auto' }}
      # 发布版本号 + 是否发布 Release，透传进 build_android.sh 与发布步骤
      RELEASE_VERSION: ${{ inputs.release_version != '' && inputs.release_version || '' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release != '' && inputs.publish_release || 'false' }}
      # 并行构建数
      JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        # 提前校验，避免填了发布却没填版本号空等 30 分钟编译
        if: ${{ inputs.publish_release }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "::error::勾选了「发布 Release」但没填写「发布版本号」；请填 X.Y.Z（如 0.1.4）再运行"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != *.*.* || "$RELEASE_VERSION" != [0-9]*.*.* ]]
          then
            echo "::error::发布版本号需为 X.Y.Z 三段式（如 0.1.4）；当前：$RELEASE_VERSION"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        # AGP 8.x requires JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          # runner 预装的 google-chrome apt 源与本次构建无关，且其 dl.google.com
          # CDN 偶发 Hash Sum mismatch，导致 `sudo apt-get update` 退出码 100，
          # 整个 workflow 连带失败（2026-09-09 连续多次命中）。runner 镜像的 chrome
          # 源文件名不固定（google-chrome.list / google.list / google-chrome-stable.list
          # 都出现过），所以用 grep 按内容动态定位并删除所有指向 dl.google.com 的源，
          # 只保留 ubuntu 官方源——我们要装的 cmake/ninja/ccache/autoconf/automake/
          # libtool 全部来自官方源，chrome 源纯属干扰。update 再做一次重试+兜底，
          # 第三方源瞬时故障不应拖垮构建。
          # The preinstalled google-chrome apt source is unrelated to this build and
          # its dl.google.com CDN intermittently returns Hash Sum mismatch, making
          # `apt-get update` exit 100 and failing the whole workflow (hit multiple
          # times on 2026-09-09). The chrome source filename varies across runner
          # images (google-chrome.list / google.list / google-chrome-stable.list), so
          # locate and remove any source pointing at dl.google.com by content, keeping
          # only the ubuntu archives which provide every package we install.
          sudo grep -rIl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | \
            xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3 || true
          # autoconf/automake/libtool: libexif(autotools overlay) 的 autoreconf 需要
          # 宿主工具（vcpkg_find_acquire_program 不认识 AUTOCONF 类 tool 名，官方
          # vcpkg_configure_make 也是 find_program 依赖系统 autoreconf）
          sudo apt-get install -y cmake ninja-build ccache autoconf automake libtool
          flutter --version
          cmake --version | head -1
          ninja --version

      - name: Restore ccache
        uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install Android NDK (pinned 27)
        # 显式锁 NDK 27.0.12077973，而不是 `ls | sort -V | tail -n1` 取“最新”。
        # 托管 runner 会预装更新的 NDK（如 29），原写法会误选 29；libffi:arm64-android
        # 在 NDK 29 下交叉编译失败。注意 sdkmanager 不在 PATH，须用全路径
        # （$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager）。
        run: |
          NDK_VER="27.0.12077973"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            SDKMGR=""
            for c in "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
                     "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                     "$ANDROID_HOME"/tools/bin/sdkmanager; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
              "$SDKMGR" --install "ndk;$NDK_VER" >/dev/null 2>&1 || true
            else
              echo "::warning::sdkmanager 未找到，无法安装 NDK $NDK_VER"
            fi
          fi
          if [ -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VER"
          else
            ANDROID_NDK_HOME="$(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
            echo "::warning::NDK $NDK_VER 未就绪，回退到 $ANDROID_NDK_HOME"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "NDK root: $ANDROID_NDK_HOME"

      - name: Restore vcpkg binary cache
        # vcpkg 二进制缓存：首次全量编译后，后续运行秒级还原依赖
        # key 版本段说明：固定 vcpkg commit + 正确的 triplet 后，key 只由
        # vcpkg.json/ports/triplets 内容 hash 驱动，无需再加手动递增后缀（历史
        # fix2/fix3 是为强制重编时 bump 的，已随 vcpkg 固定与缓存清理并入基础 key）。
        # 注：vcpkg 版本现在由 build/build_android.sh 里 VCPKG_PINNED_COMMIT 钉死，
        # 确保每次构建 ABI 一致，二进制缓存才能被真正复用。
        uses: actions/cache/restore@v4
        id: vcpkg
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Prepare release keystore (if secret)
        # 若配置了 ANDROID_KEYSTORE_BASE64 等 Secrets，则解出稳定 keystore 并在 release
        # 构建时用它签名（保证签名一致、用户可覆盖更新）；未配置则为 no-op，回退 debug 临时签名。
        # 注：GitHub 的 secrets 上下文【不能】用于 step 的 if: 条件（报 Unrecognized named-value:
        # 'secrets'），故移到 step env，用 shell 判空兜底。
        # Secrets 需在仓库 Settings → Secrets and variables → Actions 里添加：
        #   ANDROID_KEYSTORE_BASE64（keystore 的 base64）、
        #   ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/android-release.jks"
            chmod 600 "$HOME/android-release.jks"
            echo "KEYSTORE_PATH=$HOME/android-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "::notice::使用稳定 keystore 对 release APK 签名"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 等 Secrets，回退 debug 临时签名（签名每次构建不同，无法覆盖更新）"
          fi

      - name: Build C++ engine + Flutter Android app
        run: |
          export VCPKG_BINARY_SOURCES="files,${HOME}/.cache/vcpkg,readwrite"
          export CCACHE_DIR="${HOME}/.cache/ccache"
          # 兜底：Windows 上传/zip 解压易丢失执行位，先确保 build.sh 可执行
          chmod +x build.sh
          ./build.sh android "$BUILD_TYPE"

      - name: Save ccache
        # build 失败也保存（ccache 内容寻址，已编译对象依然有效），用官方推荐的显式 save
        if: ${{ always() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}

      - name: Save vcpkg binary cache
        # build 失败也保存（vcpkg 按包增量写入，已编译完的包仍然有效）
        if: ${{ always() && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}

      - name: Package APK
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK="apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk"
          else
            APK="apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          fi
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found under $APK"
            find apps/flutter_app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          ZIP="PocketKrKr-Android-${BUILD_TYPE}.apk"
          cp "$APK" "$ZIP"
          echo "已生成: $ZIP"
          ls -lh "$ZIP"
          echo "artifact=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketKrKr-Android-${{ env.BUILD_TYPE }}
          path: ${{ env.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (Android)
        # 勾选「发布 Release」且填了版本号时，打 android-vX.Y.Z tag + 建 GitHub Release + 挂 APK
        if: ${{ inputs.publish_release && inputs.release_version != '' }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          TAG="android-v${VERSION}"
          NOTES=$(printf 'PocketKrKr Android 构建，直接安装 APK（Android 7.0 / API 24+，arm64-v8a）。\n\n版本：v%s\n产物：%s\n\n> 版本号标准见仓库 README《版本号 / 发布标准》。' "$VERSION" "$(basename "${{ env.artifact }}")")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # tag 已存在：补充上传产物，不重复建 Release
            echo "Release $TAG 已存在，上传产物：${{ env.artifact }}"
            gh release upload "$TAG" "${{ env.artifact }}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "${{ env.artifact }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PocketKrKr Android v${VERSION}" \
              --notes "$NOTES"
          fi
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
